name: Import source package

on:
  push:
    paths:
      - safe-cadence-source.part*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unpack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import io
          import tarfile

          parts = sorted(Path.cwd().glob("safe-cadence-source.part*"))
          if not parts:
              raise SystemExit("Missing source-package chunks.")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          if len(encoded) > 250_000:
              raise SystemExit("Source package exceeds the import limit.")
          Path("safe-cadence-source.b64").write_text(encoded, encoding="ascii")
          raw = base64.b64decode(encoded, validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:bz2") as archive:
              members = archive.getmembers()
              if not members or len(members) > 200:
                  raise SystemExit("Unexpected archive file count.")
              if sum(member.size for member in members) > 10_000_000:
                  raise SystemExit("Source package exceeds 10 MB.")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (not member.isfile() or not path.parts
                      or path.parts[0] != "safe-cadence"
                      or len(path.parts) < 2 or ".." in path.parts
                      or path.is_absolute()):
                      raise SystemExit(f"Unsafe archive entry: {member.name}")
                  # The current GitHub App cannot commit workflow files.
                  if path.parts[1:3] == (".github", "workflows"):
                      print(f"Deferring workflow file: {path}")
                      continue
                  destination = Path.cwd().joinpath(*path.parts[1:])
                  if destination.is_symlink():
                      raise SystemExit(f"Symlink destination: {destination}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(member) as file:
                      destination.write_bytes(file.read())
          PY
          python -X utf8 launcher.py encoding
          rm -f safe-cadence-source.b64 safe-cadence-source.part*
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          # Workflow files are managed separately from the source package.
          builder = Path("scripts/build_manifest.py")
          source = builder.read_text(encoding="utf-8")
          marker = "EXCLUDE_DIRS = {'.git',"
          if marker not in source:
              raise SystemExit("Could not safely update the manifest exclusions.")
          builder.write_text(
              source.replace(marker, "EXCLUDE_DIRS = {'.github', '.git',", 1),
              encoding="utf-8",
          )
          subprocess.run([sys.executable, "-m", "scripts.build_manifest"], check=True)
          PY
          python -X utf8 launcher.py verify
          python -X utf8 launcher.py encoding
      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Safe-Cadence source"
            git push origin HEAD:main
          fi
