name: Import source package

on:
  push:
    paths:
      - safe-cadence-source.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unpack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import io
          import stat
          import tarfile

          source = Path("safe-cadence-source.b64")
          if not source.is_file() or source.stat().st_size > 250_000:
              raise SystemExit("Missing or oversized source package.")
          raw = base64.b64decode(source.read_text(encoding="ascii"), validate=False)
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:bz2") as archive:
              members = archive.getmembers()
              if not members or len(members) > 200:
                  raise SystemExit("Unexpected archive file count.")
              if sum(member.size for member in members) > 10_000_000:
                  raise SystemExit("Source package exceeds 10 MB.")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (not member.isfile() or not path.parts
                      or path.parts[0] != "safe-cadence"
                      or len(path.parts) < 2 or ".." in path.parts
                      or path.is_absolute()):
                      raise SystemExit(f"Unsafe archive entry: {member.name}")
                  destination = Path.cwd().joinpath(*path.parts[1:])
                  if destination.is_symlink():
                      raise SystemExit(f"Symlink destination: {destination}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(member) as file:
                      destination.write_bytes(file.read())
          PY
          python -X utf8 launcher.py verify
          python -X utf8 launcher.py encoding
          rm safe-cadence-source.b64 .github/workflows/import-source.yml
      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Safe-Cadence source"
            git push origin HEAD:main
          fi
